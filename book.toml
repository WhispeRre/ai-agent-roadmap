[book]
authors = ["liuzeyu03"]
language = "zh-CN"
src = "src/zh"
title = "AI Agent Roadmap"

[build]
build-dir = "book/zh"

[preprocessor.katex]
after = ["links"]
optional = true

[output.html]
mathjax-support = false
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
no-section-label = true
git-repository-url = "https://github.com/liuzeyu03/ai-agent-roadmap"
git-repository-icon = "fa-github"

[output.html.print]
enable = false
